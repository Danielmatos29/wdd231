<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Daniel Matos Romero">
    <meta name="description" content="Your complete vault for bodyweight fitness.">
    <link rel="stylesheet" href="styles/project-normalized.css">
    <link rel="stylesheet" href="styles/project.css">
    <link rel="stylesheet" href="styles/project-large.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="scripts/library&routine.js" defer></script>
    <title>Calisthenics & Bodyweight Training Vault - library and routine</title>
</head>
<body>
    <header>
        <span>Calisthenics Vault</span>
        <nav id="nav-bar" class="navigation">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#" class="current">Library</a></li>
                <li><a href="#">Outdoor Spots</a></li>
            </ul>
        </nav>
        <button class="hamburger" id="ham-btn" aria-label="Open menu navigation"></button>
    </header>
    <main>
        <h1>Exercise Library & Routine Builder</h1>
        <div class="search-wrapper">
            <label for="search">Search Exercise</label>
            <input type="search" id="search" placeholder="Search by name, muscle, or type...">
        </div>
        <div class="Routine_container">
            <div class="cards-container"></div>
            <aside class="routine-panel">
                <h2>Current Routine</h2>
                <ul id="routine-list" class="routine-list"></ul>

                <div class="routine-save">
                    <input type="text" id="routine-name" placeholder="Name Your Routine">
                    <button id="save-routine-btn" type="button">Save Routine</button>
                </div>
            </aside>
        </div>
    </main>
    <footer></footer>
</body>
</html>
