<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Daniel Matos Romero">
    <meta name="description" content="Join CalisthenicsVault today. Create your account to track your skill progressions, save custom routines, and unlock your full bodyweight potential.">
    <link rel="stylesheet" href="styles/project-normalized.css">
    <link rel="stylesheet" href="styles/project.css">
    <link rel="stylesheet" href="styles/project-large.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;700;900&display=swap" rel="stylesheet">

    <link rel="icon" href="images/calisthenicslogo.ico">
    <script src="scripts/join.js" defer></script>

    <meta property="og:title" content="CalisthenicsVault">
    <meta property="og:locale" content="en_US">
    <meta property="og:description" content="Master calisthenics with CalisthenicsVault. Access step-by-step skill progression guides, dynamic bodyweight routines, and real-time training weather lookups to optimize your workouts.">
    <meta property="og:image" content="https://danielmatos29.github.io/wdd231/CalisthenicsVault/images/handstand.webp">
    <meta property="og:url" content="https://danielmatos29.github.io/wdd231/CalisthenicsVault/index.html">
    <title>Join to Calisthenics Vault</title>
</head>
<body>
    <header>
        <img src="images/calisthenicslogo.ico" alt="Calisthenics Vault representative logo" class="favicon">
        <span>Calisthenics Vault</span>
        <button class="hamburger" id="ham-btn" aria-label="Open menu navigation"></button>
        <nav id="nav-bar" class="navigation">
            <ul>
                <li><a href="https://danielmatos29.github.io/wdd231/CalisthenicsVault/">Home</a></li>
                <li><a href="https://danielmatos29.github.io/wdd231/CalisthenicsVault/library&routine">Library</a></li>
                <li><a href="https://danielmatos29.github.io/wdd231/CalisthenicsVault/outdoorspots">Outdoor Spots</a></li>
                <li><a href="https://danielmatos29.github.io/wdd231/CalisthenicsVault/join" class="current">Join</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1 class="joinTitle">Join</h1>
        <div class="form-container">
            <form method="GET" action="thankyou.html" class="joinForm">
                <h2>Membership Application Form</h2>
                <label>First Name: <input type="text" required name="firstName" title="Your First Name" autocomplete="given-name" class="fname"></label>
                <label>Last Name: <input type="text" required name="lastName" title="Your First Name" autocomplete="family-name" class="lname"></label>
            
                <label>Email Address: <input type="email" required name="emailAddress" title="Your Email Address" autocomplete="email" placeholder="test@example.com" class="email"></label>
                <label>Phone Number: <input type="tel" required name="phoneNumber" title="Your Phone Number" autocomplete="tel" class="phone"></label>

                <label>Type your review: <textarea name="review" title="Calisthenics Vault Review" rows="4" cols="50" class="review"></textarea></label>

                <input type="hidden" name="formLoadedTimestamp" id="formLoadedTimestamp">

                <input type="submit" value="Become a Calisthenics Athlete!">
            </form>
        </div>
    </main>
    <footer>
        <div class="footerContainer">
            <div class="contacts">
                <p>info@calisthenicsvault.com</p>
                <p>(849)-345-2345</p>
            </div>

            <nav class="SocialMedia">
                <ul>
                    <li><a href="https://github.com/Danielmatos29/wdd231.git"><img src="images/github-icon.svg" alt="Daniel's Github Repository" class="github_icon" width="50" height="50"></a></li>
                    <li><a href="https://www.linkedin.com/in/daniel-matos-79946b3ab/"><img src="images/linkedin-icon.svg" alt="Daniel's LinkedIn Profile" class="linkedin_icon" width="50" height="50"></a></li>
                    <li><a href="https://www.youtube.com/watch?v=PwgR2POPe5Y"><img src="images/youtube.svg" alt="Video Demonstration and Reflection" class="linkedin_icon" width="50" height="50"></a></li>
                </ul>
            </nav>

            <div class="credits">
                <p>&copy; <span id="currentYear"></span></p>
                <p id="lastModified"></p>
                <p>Daniel Matos, WDD231, Dominican Republic</p> 
            </div>
        </div>
    </footer>
</body>
</html>
